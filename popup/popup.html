<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lovable Prompt Helper</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="logo">Lovable Prompt Helper</span>
    <button type="button" id="open-settings" title="Settings">⚙︎</button>
  </header>

  <main>
    <div class="input-card">
      <textarea id="idea" placeholder="Describe your app idea…" rows="2"></textarea>
      <button type="button" id="enhance">Enhance</button>
    </div>

    <div id="output-area" class="output-card" hidden>
      <div class="output-header">
        <span class="output-label">Refined prompt</span>
        <button type="button" id="copy">
          <span id="copy-text">Copy</span>
          <span id="copy-status" aria-live="polite"></span>
        </button>
      </div>
      <div id="result"></div>
    </div>

    <p id="error" class="error" aria-live="polite" hidden></p>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
